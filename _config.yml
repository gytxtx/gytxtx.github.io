    icon: <i class="fa-brands fa-github"></i>
    link: https://github.com/gytxtx/
  - name: E-Mail
    icon: <i class="fa-solid fa-envelope"></i>
    link: mailto:gytxtx@outlook.com

navigation:
  - name: 首页
    link: ./index.html
  - name: 博客
    link: ./Blog/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md.bak
  - vendor/
