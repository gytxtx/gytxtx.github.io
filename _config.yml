url: "https://gytxtx.top"
baseurl: ""
repository: gytxtx/gytxtx.github.io

remote_theme: vaibhavvikas/jekyll-theme-minimalistic
color-scheme: auto
favicon: true

author:
  name: gytxtx
  email: gytxtx@outlook.com
  github: gytxtx

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag

platforms:
